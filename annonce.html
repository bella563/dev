<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter une Annonce - Khouma Compagnie</title>
  <link rel="stylesheet" href="css/annonce.css">
</head>
<body>
  <div class="form-container">
    <!-- Titre centré -->
    <div class="row title-row">
      <h2>Publier une Realisation</h2>
    </div>

    <!-- Formulaire + Vidéo -->
    <div class="row form-row">
      <!-- Colonne formulaire -->
      <div class="form-col">
        <form id="formAnnonce">
          <label for="titre">Titre </label>
          <input type="text" id="titre" placeholder="Titre" required>

          <label for="contenu">Description</label>
          <textarea id="contenu" rows="4" placeholder="Contenu" required></textarea>

          <label for="image">Image</label>
          <input type="file" id="image" accept="image/*" required>

          <label for="dateExpiration">Date d'expiration (facultatif)</label>
          <input type="date" id="dateExpiration">

          <button type="submit">Publier</button>
        </form>
      </div>

      <!-- Colonne vidéo -->
      <div class="image-col">
        <div class="video-wrapper">
          <video autoplay muted loop playsinline class="form-video">
            <source src="src/annonce.mp4" type="video/mp4">
            Votre navigateur ne supporte pas la vidéo HTML5.
          </video>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    document.getElementById("formAnnonce").addEventListener("submit", function(e) {
      e.preventDefault();

      const titre = document.getElementById("titre").value.trim();
      const contenu = document.getElementById("contenu").value.trim();
      const imageInput = document.getElementById("image");
      const dateExpiration = document.getElementById("dateExpiration").value;

      if (!imageInput.files[0]) {
        alert("Veuillez sélectionner une image.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function () {
        const imageBase64 = reader.result;

        const annonce = {
          titre: titre,
          contenu: contenu,
          image: imageBase64,
          date: new Date().toLocaleString(),
          dateExpiration: dateExpiration || null,
        };

        let annonces = JSON.parse(localStorage.getItem("annonces")) || [];
        annonces.unshift(annonce);
        localStorage.setItem("annonces", JSON.stringify(annonces));

        alert("Annonce publiée avec succès !");
        window.location.href = "realisation.html";
      };

      reader.readAsDataURL(imageInput.files[0]);
    });
  </script>
</body>
</html>
