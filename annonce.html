<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter une Annonce</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      padding: 30px;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <body>
    <h2 style="text-align:center;">Publier une Annonce</h2>
    <form id="formAnnonce">
      <label for="titre">Titre de l'annonce</label>
      <input type="text" id="titre" placeholder="Titre" required>
  
      <label for="contenu">Contenu de l'annonce</label>
      <textarea id="contenu" rows="4" placeholder="Contenu" required></textarea>
  
      <label for="image">Image</label>
      <input type="file" id="image" accept="image/*" required>
  
      <label for="dateExpiration">Date d'expiration (facultatif)</label>
      <input type="date" id="dateExpiration">
  
      <button type="submit">Publier</button>
    </form>
  
    <script>
      document.getElementById("formAnnonce").addEventListener("submit", function(e) {
        e.preventDefault();
  
        const titre = document.getElementById("titre").value.trim();
        const contenu = document.getElementById("contenu").value.trim();
        const imageInput = document.getElementById("image");
        const dateExpiration = document.getElementById("dateExpiration").value;
  
        if (!imageInput.files[0]) {
          alert("Veuillez sélectionner une image.");
          return;
        }
  
        const reader = new FileReader();
  
        reader.onload = function () {
          const imageBase64 = reader.result;
  
          // Si aucune date d'expiration n'est définie, on la laisse à null
          const annonce = {
            titre: titre,
            contenu: contenu,
            image: imageBase64,
            date: new Date().toLocaleString(),
            dateExpiration: dateExpiration || null, // Si dateExpiration est vide, elle sera null
          };
  
          let annonces = JSON.parse(localStorage.getItem("annonces")) || [];
          annonces.unshift(annonce); // Ajoute l'annonce en première position
          localStorage.setItem("annonces", JSON.stringify(annonces));
  
          alert("Annonce publiée avec succès !");
          window.location.href = "realisation.html"; // Redirige vers une autre page
        };
  
        reader.readAsDataURL(imageInput.files[0]);
      });
    </script>
  </body>
  

</body>

</html>
